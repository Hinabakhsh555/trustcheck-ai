name: Test and deploy TrustCheck API

on:
  push:
    branches: [release-candidate-v1-2-global]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'function_app.py'
      - 'host.json'
      - 'requirements.txt'
      - '.github/workflows/deploy-azure-functions.yml'
  workflow_dispatch:

jobs:
  test:
    name: Backend tests (offline mocks only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend function_app.py tests
      - name: Run private API tests (no Azure calls)
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  deploy:
    name: Azure deployment (only when OIDC variables exist)
    needs: test
    if: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare minimal Azure Functions package
        run: |
          mkdir -p api_deploy
          cp function_app.py host.json requirements.txt api_deploy/
          cp -r backend api_deploy/backend
      - name: Login to Azure using federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure Functions Flex Consumption
        uses: Azure/functions-action@v1
        with:
          app-name: Trustcheck-ai-api
          package: api_deploy
          sku: flexconsumption
          remote-build: true

  missing-azure-variables:
    name: Azure deployment skipped - configure OIDC variables
    needs: test
    if: ${{ vars.AZURE_CLIENT_ID == '' || vars.AZURE_TENANT_ID == '' || vars.AZURE_SUBSCRIPTION_ID == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment blocker
        run: |
          echo "::warning::Azure deployment was NOT attempted because repository Actions variables are missing."
          echo "Add AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID as GitHub Actions variables."
          echo "Piku and Azure infrastructure are unchanged. A passing test job is NOT proof of Azure deployment."
