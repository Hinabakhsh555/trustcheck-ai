name: Deploy TrustCheck API to Azure Functions

on:
  push:
    branches: [release-candidate-v1-2-global]
    paths:
      - 'backend/**'
      - 'function_app.py'
      - 'host.json'
      - 'requirements.txt'
      - '.github/workflows/deploy-azure-functions.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m compileall -q backend function_app.py
      - name: Install Azure Functions dependencies
        run: pip install -r requirements.txt --target=".python_packages/lib/site-packages"
      - name: Login to Azure using federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy function app
        uses: Azure/functions-action@v1
        with:
          app-name: Trustcheck-ai-api
          package: .
          sku: flexconsumption
          remote-build: false
