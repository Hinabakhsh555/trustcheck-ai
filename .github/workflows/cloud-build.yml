name: TrustCheck Android Cloud Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source bundle
        run: |
          cat archive/chunk00 archive/chunk01 archive/chunk02 archive/chunk03 archive/chunk04 archive/chunk05 archive/chunk06 archive/chunk07 > trustcheck_ai_complete_v1.zip.b64
          base64 -d trustcheck_ai_complete_v1.zip.b64 > trustcheck_ai_complete_v1.zip
          unzip -q trustcheck_ai_complete_v1.zip
          test -f trustcheck_ai_v1/pubspec.yaml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android host
        working-directory: trustcheck_ai_v1
        run: |
          chmod +x tool/bootstrap_android.sh
          ./tool/bootstrap_android.sh

      - name: Install dependencies
        working-directory: trustcheck_ai_v1
        run: flutter pub get

      - name: Static analysis
        working-directory: trustcheck_ai_v1
        run: flutter analyze

      - name: Unit tests
        working-directory: trustcheck_ai_v1
        run: flutter test

      - name: Build debug APK
        working-directory: trustcheck_ai_v1
        run: flutter build apk --debug

      - name: Build release AAB
        working-directory: trustcheck_ai_v1
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trustcheck-ai-debug-apk
          path: trustcheck_ai_v1/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: trustcheck-ai-release-aab
          path: trustcheck_ai_v1/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
